{% extends "components/base.html" %}
{% load static %}

{% block title %}Register | ARKEYEZ{% endblock %}

{% block content %}
<div class="row align-items-center">

    <div class="header-text mb-4">
        <h3>Create an account</h3>
    </div>

    {% if form.errors %}
        <p class="text-danger">There was an error with your form...</p>
    {% endif %}

    <form action="{% url 'register' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="input-group mb-3 d-flex justify-content-center">
            <button class="btn btn-lg btn-primary w-100 fs-6" style="min-width: 200px;" type="submit">Register</button>
        </div>
    </form>

    <div class="input-group mb-3 d-flex justify-content-center">
<a href="{% url 'login' %}" class="btn btn-lg btn-primary w-100 fs-6 btn-custom" style="min-width: 200px;">Login</a>
    </div>

    <div class="input-group mb-3 d-flex justify-content-center">
<a href="{% url 'admin_user_create' %}" class="btn btn-lg btn-primary w-100 fs-6 btn-custom" style="min-width: 200px;">Admin Account</a>
    </div>

</div>
{% endblock %}
