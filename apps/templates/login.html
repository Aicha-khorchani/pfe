{% extends "components/base.html" %}
{% load static %}

{% block title %}Login | ARKEYEZ{% endblock %}

{% block content %}
<div class="row align-items-center">
        <div class="header-text mb-4">
             <h2>Hello, Again</h2>
            <h3 class="mb-4">Connect to your account</h3>
        </div>
            <form method="POST">
                {% csrf_token %}
                <div class="input-group mb-3 d-flex justify-content-center">
                {{ form.username }}
                </div>

                <div class="input-group mb-3 d-flex justify-content-center">
                {{ form.password }}
                </div>

                <div class="input-group mb-3 d-flex justify-content-center">
                {% if error_message %}
                <p style="color:red">{{ error_message }}</p>
                {% endif %}
                </div>

                <div class="input-group mb-3 d-flex justify-content-center">
                <button class="btn btn-primary w-100 mt-3">Login</button>
                </div>
                
                <div class="input-group mb-3 d-flex justify-content-center">
                   <a href="{% url 'register' %}" class="btn btn-primary w-100 mt-3">Sign Up</a>
                </div>

            </form>

 </div>
{% endblock %}
