{% extends "components/base.html" %}
{% load static %}

{% block title %}Add Product | ARKEYEZ{% endblock %}

{% block content %}
        <div class="row align-items-center">
            <div class="header-text mb-4">
                <h3>Add a New Product</h3>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="input-group mb-3">
                    <input type="text" id="product_name" name="product_name" class="form-control form-control-lg bg-light fs-6" placeholder="Product name">
                </div>

                <div class="input-group mb-3">
                    <input type="text" id="unit_price" name="unit_price" class="form-control form-control-lg bg-light fs-6" placeholder="Unit price">
                </div>

                <div class="input-group mb-3">
                    <input type="text" id="volume_price" name="volume_price" class="form-control form-control-lg bg-light fs-6" placeholder="Total price">
                </div>

                <div class="input-group mb-3 d-flex justify-content-center">
                    <button class="btn btn-lg btn-primary w-100 fs-6 btn-custom" style="min-width: 200px;" type="submit">Add Product</button>
                </div>
            </form>

            <!-- Show all products button as <a> styled as button -->
            <div class="input-group mb-3 d-flex justify-content-center">
                <a href="{% url 'all_items' %}" class="btn btn-lg btn-primary w-100 fs-6 btn-custom" style="min-width: 200px;">Show All Products</a>
            </div>

</div>
{% endblock %}
