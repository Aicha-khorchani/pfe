{% extends "components/base2.html" %}
{% load static %}

{% block title %}Add Return | ARKEYEZ{% endblock %}

{% block content %}
<div class="row align-items-center">

    <div class="header-text mb-4 text-center">
        <h3>Add Return</h3>
    </div>
    <form method="POST" action="/apps/add_retour" id="retourForm" class="w-100">
        {% csrf_token %}

        <!-- Select Facture -->
        <div class="mb-4">
            <label for="factureSelect" class="form-label">Select Facture:</label>
            <select id="factureSelect" name="facture" class="form-select" required>
                <option value="" disabled selected>Choose a Facture</option>
                {% for facture in factures %}
                    <option value="{{ facture.pk }}">Facture {{ facture.facture_id }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Select Commands -->
        <div class="mb-4">
            <label for="commandSelect" class="form-label">Select Commands:</label>
            <select id="commandSelect" name="selected_commands" class="form-select" multiple required>
                <!-- Dynamically populated via JavaScript -->
            </select>
        </div>

        <!-- Reason for Return -->
        <div class="mb-4">
            <label for="raison_retour" class="form-label">Reason for Return:</label>
            <textarea id="raison_retour" name="raison_retour" class="form-control" rows="3" required></textarea>
        </div>

        <!-- Return Date -->
        <div class="mb-4">
            <label for="date_retour" class="form-label">Return Date:</label>
            <input type="date" id="date_retour" name="date_retour" class="form-control" required>
        </div>

        <!-- Supplier -->
        <div class="mb-3">
            <select name="supplier" id="supplier" class="form-select" required>
                <option value="" disabled selected>Choose a supplier</option>
                {% for supplier in suppliers %}
                    <option value="{{ supplier.pk }}">{{ supplier.supplier_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Delivery Person -->
        <div class="mb-4">
            <label for="livreur" class="form-label">Select Delivery Person:</label>
            <select id="livreur" name="livreur" class="form-select" required>
                <option value="" disabled selected>Choose a Delivery Person</option>
                {% for livreur in livreurs %}
                    <option value="{{ livreur.pk }}">{{ livreur.full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Additional Information -->
        <div class="mb-4">
            <label for="informations_supp" class="form-label">Additional Information:</label>
            <textarea id="informations_supp" name="informations_supp" class="form-control" rows="2" required></textarea>
        </div>

        <!-- Buttons -->
        <div class="d-flex flex-column align-items-center gap-3 mt-4">
            <button type="submit" class="btn btn-lg btn-primary w-100 fs-6 btn-custom">Submit Return</button>
            <button type="button" class="btn btn-lg btn-primary w-100 fs-6 btn-custom" onclick="window.print()">Print Retour Note</button>
            <a href="{% url 'all_retour' %}" class="btn btn-outline-primary  w-100">Show All Returns</a>
        </div>

    </form>
</div>

{% block extra_scripts %}
<script src="{% static 'add_retour.js' %}"></script>
{% endblock %}

{% endblock %}
