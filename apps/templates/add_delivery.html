{% extends "components/base2.html" %}
{% load static %}

{% block title %}COM ARKEYEZ | Add Delivery{% endblock %}
{% block content %}
             <div class="row align-items-center">
                <div class="header-text mb-4">
                    <h3>Add a New Delivery</h3>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <input type="text" id="company_name" name="company_name" class="form-control form-control-lg bg-light fs-6" placeholder="Company Name" required>
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" id="contact_info" name="contact_info" class="form-control form-control-lg bg-light fs-6" placeholder="Contact Information" required>
                    </div>

                    <label for="delivery_person" class="form-label">Select Delivery Person</label>
                    <select name="delivery_person" id="delivery_person" class="form-select mb-3" required>
                        <option value="" disabled selected>Choose a delivery person</option>
                        {% for livreur in Livreurss %}
                            <option value="{{ livreur.id }}">{{ livreur.username }} - {{ livreur.company_name }}</option>
                        {% endfor %}
                    </select>

                    <div class="input-group mb-3">
                        <input type="text" id="delivery_person_number" name="delivery_person_number" class="form-control form-control-lg bg-light fs-6" placeholder="Delivery Person Number" required>
                    </div>

                    <!-- Buttons Row -->
                    <div class="d-flex gap-2 mb-3">
                        <button class="btn btn-primary flex-fill fs-6" type="submit">Add Delivery</button>
                    </div>
                </form>


</div>
{% endblock %}
