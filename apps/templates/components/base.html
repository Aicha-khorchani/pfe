<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ARKEYEZ{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row border rounded-5 p-3 bg-white shadow box-area">

            <!-- LEFT BOX (shared everywhere) -->
            <div class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left-box"
                 style="background: #103cbe;">
                <img src="{% static 'images/1.png' %}" class="img-fluid" style="width: 250px;">
                <p class="text-white fs-2" style="font-family: 'Courier New'; font-weight: 600;">
    {{ GO_DIGITAL_TITLE }}
                </p>
                <small class="text-white text-wrap text-center" style="width: 17rem;">
    {{ GO_DIGITAL_SUBTITLE }}
                </small>
            </div>

            <!-- PAGE CONTENT -->
            <div class="col-md-6 right-box">
                {% block content %}{% endblock %}
            </div>

        </div>
    </div>

    {% include "components/footer.html" %}

</body>
</html>
