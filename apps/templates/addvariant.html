{% extends "components/base2.html" %}
{% load static %}

{% block title %}Add Variant | ARKEYEZ{% endblock %}

{% block content %}
            <div class="row align-items-center">
                <div class="header-text mb-4">
                    <h3>Add Variant</h3>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Please correct the errors below.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="form-group mb-3">
                        <label for="item_id" class="form-label">Select Item:</label>
                        <select name="item_id" id="item_id" class="form-select" required>
                            <option value="" disabled selected>Choose an item</option>
                            {% for item in items %}
                                <option value="{{ item.item }}">{{ item.product_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="input-group mb-3">
                        <input type="text" id="variant_name" name="variant_name"
                               class="form-control form-control-lg bg-light fs-6" placeholder="Variant name">
                    </div>

                    <div class="input-group mb-3">
                        <input type="text" id="variant_values" name="variant_values"
                               class="form-control form-control-lg bg-light fs-6" placeholder="e.g., Red, Blue, Green">
                    </div>

                    <div class="input-group mb-3 d-flex justify-content-center">
                        <button type="submit" class="btn btn-lg btn-primary w-100 fs-6 btn-custom"
                                style="min-width:200px;">Confirm Variant</button>
                    </div>
                </form>

                <!-- Buttons as <a> styled as button -->
                <div class="input-group mb-3 d-flex justify-content-center">
                    <a href="{% url 'all_items' %}" class="btn btn-lg btn-primary w-100 fs-6 btn-custom"
                       style="min-width:200px;">Show All Products</a>
                </div>


        
</div>
{% endblock %}
