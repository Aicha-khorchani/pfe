{% extends "components/base2.html" %}
{% load static %}

{% block title %} {{COM_AICHA}} | Add Customer{% endblock %}

{% block content %}
            <div class="row align-items-center">
                <div class="header-text mb-4">
                    <h3>Add a New Customer</h3>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <input type="text" id="customer_name" name="customer_name" class="form-control form-control-lg bg-light fs-6" placeholder="Customer Name" required>
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" id="contact_person" name="contact_person" class="form-control form-control-lg bg-light fs-6" placeholder="Contact Person" required>
                    </div>
                    <div class="input-group mb-3">
                        <input type="number" id="phone_number" name="phone_number" class="form-control form-control-lg bg-light fs-6" placeholder="Phone Number" required>
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" id="email" name="email" class="form-control form-control-lg bg-light fs-6" placeholder="Email Address" required>
                    </div>
                    <div class="input-group mb-3">
                        <label class="form-label fs-6 me-3">Customer Type:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="volume" name="customer_type" value="volume">
                            <label class="form-check-label" for="volume">Volume Customer</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="retail" name="customer_type" value="retail" checked>
                            <label class="form-check-label" for="retail">Retail Customer</label>
                        </div>
                    </div>

                    <!-- Buttons Row -->
                    <div class="d-flex gap-2 mb-3">
                        <button class="btn btn-primary flex-fill fs-6" type="submit">Add Customer</button>
                    </div>
                </form>
</div>
{% endblock %}
